# Backend on Fly.io:  fly launch --no-deploy  then  fly deploy
app = "bioide-api"
primary_region = "sin"          # Singapore; closest Fly region to India

[build]
  dockerfile = "backend/Dockerfile"

[env]
  BIOIDE_DATA_DIR = "/data"
  BIOIDE_ALLOW_CODE_EXEC = "0"
  BIOIDE_ALLOW_LOCAL_INSTALL = "0"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response]
    pristine = true

  [[http_service.checks]]
    grace_period = "40s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "bioide_data"
  destination = "/data"

[[vm]]
  # 1 GB is the practical floor: iJO1366 plus a PyDESeq2 fit needs headroom.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
